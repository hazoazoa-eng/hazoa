<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>강의 영상 게시판</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <a id="back" class="icon" href="#" aria-label="목록으로" hidden>
      <svg viewBox="0 0 24 24"><path d="M20 12H5M11 5l-7 7 7 7"/></svg>
    </a>
    <h1 id="board" class="board">강의 영상 게시판</h1>
    <button id="done" class="icon check" type="button" aria-label="시청 완료 표시" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path class="tick" d="M8 12.5l3 3 5-6"/></svg>
    </button>
  </header>

  <main>
    <!-- 목록 -->
    <ul id="list" class="list"></ul>

    <!-- 글 보기 -->
    <article id="post" hidden>
      <h2 id="post-title" class="title"></h2>
      <div id="post-body" class="body"></div>
      <nav class="prevnext">
        <a id="prev" href="#">‹&nbsp; 이전</a>
        <a id="next" href="#">다음 &nbsp;›</a>
      </nav>
    </article>

    <p id="error" class="error" hidden></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
